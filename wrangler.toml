name = "kiguflow"
main = "src/worker.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]
routes = [
  { pattern = "kiguflow.com", custom_domain = true },
  { pattern = "www.kiguflow.com", custom_domain = true }
]

[triggers]
crons = ["0 18 * * *"]

[assets]
directory = "dist"
binding = "ASSETS"

[[r2_buckets]]
binding = "FILES"
bucket_name = "kiguflow-files"

[vars]
APP_URL = "https://kiguflow.com"
ALLOWED_ORIGINS = "https://kiguflow.com,https://www.kiguflow.com"
ENVIRONMENT = "production"
