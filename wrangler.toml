name = "kiguflow"
main = "src/worker.ts"
compatibility_date = "2026-09-01"
compatibility_flags = [ "nodejs_compat" ]

[triggers]
crons = [ "0 18 * * *" ]

[assets]
directory = "dist"
binding = "ASSETS"

[[r2_buckets]]
binding = "FILES"
bucket_name = "kiguflow-files"

[[queues.producers]]
binding = "UPLOAD_SCANS"
queue = "kiguflow-upload-scans"

[[queues.consumers]]
queue = "kiguflow-upload-scans"
max_batch_size = 1
max_retries = 3
dead_letter_queue = "kiguflow-upload-scan-failures"

[vars]
APP_URL = "https://kiguflow.com"
ALLOWED_ORIGINS = "https://kiguflow.com"
ENVIRONMENT = "production"
R2_ACCOUNT_ID = "843200bdff7ed1404df02b5f77eda556"
R2_BUCKET_NAME = "kiguflow-files"
RESEND_FROM_EMAIL = "notifications@kiguflow.com"
