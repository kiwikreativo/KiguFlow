name = "kiguflow"
main = "src/worker.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

[triggers]
crons = ["0 18 * * *"]

[assets]
directory = "dist"
binding = "ASSETS"

[[r2_buckets]]
binding = "FILES"
bucket_name = "kiguflow-files"

[vars]
APP_URL = "http://localhost:8787"
ALLOWED_ORIGINS = "http://localhost:8787,http://localhost:4321"
ENVIRONMENT = "development"
